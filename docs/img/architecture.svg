<svg style="color:#222" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rankai architecture: once a day every source is fetched into SQLite, embedded, and new postings get a field label from Claude Haiku; each search goes through a Haiku rewrite, hybrid recall, Qwen3 rerank, the learned ranker L and filters, and is served over MCP, a local search page, the CLI and JSONL logs" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12">
